<div class="col-md-4">
  <p *ngIf="message" role="alert">{{ message }}</p>
  <h2 class="text-center">Edit Trip</h2>
  <p *ngIf="submitted && editForm.invalid" role="alert">Please correct the highlighted fields before saving.</p>
  <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="code">Code:</label>
      <input
        type="text"
        id="code"
        [attr.aria-invalid]="submitted && f['code'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['code'].invalid ? 'code-error' : null"
        formControlName="code"
        placeholder="Code"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['code'].errors }" />
      <div id="code-error" class="invalid-feedback d-block" *ngIf="submitted && f['code'].errors">
        <div *ngIf="f['code'].errors?.['required']">Trip Code is required</div>
      </div>
    </div>
    <div class="form-group">
      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        [attr.aria-invalid]="submitted && f['name'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['name'].invalid ? 'name-error' : null"
        formControlName="name"
        placeholder="Name"
        autocomplete="off"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" />
      <div id="name-error" class="invalid-feedback d-block" *ngIf="submitted && f['name'].errors">
        <div *ngIf="f['name'].errors?.['required']">Name is required</div>
      </div>
    </div>
    <div class="form-group">
      <label for="length">Length:</label>
      <input
        type="text"
        id="length"
        [attr.aria-invalid]="submitted && f['length'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['length'].invalid ? 'length-error' : null"
        formControlName="length"
        placeholder="Length"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['length'].errors }" />
      <div id="length-error" class="invalid-feedback d-block" *ngIf="submitted && f['length'].errors">
        <div *ngIf="f['length'].errors?.['required']">Length is required</div>
      </div>
    </div>
    <div class="form-group">
      <label for="start">Start:</label>
      <input
        type="date"
        id="start"
        [attr.aria-invalid]="submitted && f['start'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['start'].invalid ? 'start-error' : null"
        formControlName="start"
        placeholder="Start"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['start'].errors }" />
      <div id="start-error" class="invalid-feedback d-block" *ngIf="submitted && f['start'].errors">
        <div *ngIf="f['start'].errors?.['required']">Date is required</div>
      </div>
    </div>
    <div class="form-group">
      <label for="resort">Resort:</label>
      <input
        type="text"
        id="resort"
        [attr.aria-invalid]="submitted && f['resort'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['resort'].invalid ? 'resort-error' : null"
        formControlName="resort"
        placeholder="Resort"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }" />
      <div id="resort-error" class="invalid-feedback d-block" *ngIf="submitted && f['resort'].errors">
        <div *ngIf="f['resort'].errors?.['required']">Resort is required</div>
      </div>
    </div>
    <div class="form-group">
      <label for="perPerson">Per Person:</label>
      <input
        type="number"
        min="0"
        step="0.01"
        id="perPerson"
        [attr.aria-invalid]="submitted && f['perPerson'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['perPerson'].invalid ? 'perPerson-error' : null"
        formControlName="perPerson"
        placeholder="Per Person"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }" />
      <div id="perPerson-error" class="invalid-feedback d-block" *ngIf="submitted && f['perPerson'].errors">
        <div *ngIf="f['perPerson'].errors?.['min']">Price cannot be negative.</div>
        <div *ngIf="f['perPerson'].errors?.['required']">
          Per Person is required
        </div>
      </div>
    </div>
    <div class="form-group">
      <label for="image">Image Name:</label>
      <input
        type="text"
        id="image"
        [attr.aria-invalid]="submitted && f['image'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['image'].invalid ? 'image-error' : null"
        formControlName="image"
        placeholder="Image"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['image'].errors }" />
      <div id="image-error" class="invalid-feedback d-block" *ngIf="submitted && f['image'].errors">
        <div *ngIf="f['image'].errors?.['required']">
          Image Name is required
        </div>
      </div>
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <input
        type="text"
        id="description"
        [attr.aria-invalid]="submitted && f['description'].invalid ? true : null"
        [attr.aria-describedby]="submitted && f['description'].invalid ? 'description-error' : null"
        formControlName="description"
        placeholder="Description"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['description'].errors }" />
      <div id="description-error" class="invalid-feedback d-block" *ngIf="submitted && f['description'].errors">
        <div *ngIf="f['description'].errors?.['required']">
          Description is required
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-info" [disabled]="isSubmitting">Save</button>
  </form>
</div>
